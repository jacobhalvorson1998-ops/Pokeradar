name: Refresh Pokémon prices
on:
  schedule:
    - cron: '18 14 * * *' # daily 14:18 UTC (~8–9 AM Central depending on DST)
  workflow_dispatch:
    inputs:
      quick_refresh:
        description: 'Five-minute verification pass; scheduled updates retain the full 25-minute provider budget'
        required: false
        type: boolean
        default: false
      priority_card:
        description: 'Optional exact card key; supply this OR a set ID (one priority request/hour)'
        required: false
        type: string
      priority_set:
        description: 'Optional exact catalog set ID, for example base1'
        required: false
        type: string
  push:
    branches: [main]
    paths: ['scripts/**', 'tests/**', '.github/workflows/update-and-publish.yml']
permissions:
  contents: write
concurrency:
  group: pokeradar-update-and-publish
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate authenticated priority request
        if: github.event_name == 'workflow_dispatch'
        run: node scripts/priority-request.mjs
        env:
          PRIORITY_CARD: ${{ inputs.priority_card }}
          PRIORITY_SET: ${{ inputs.priority_set }}
      - name: Restore evaluation histories
        id: historycache
        uses: actions/cache/restore@v4
        with:
          path: .cache/pokeradar/full-history.json
          key: pokeradar-history-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            pokeradar-history-${{ runner.os }}-
      - name: Validate updater and app
        run: |
          node --test tests/*.test.mjs
          node --check site/app.js
      - name: Run catalog and market updater
        run: node scripts/sync.mjs
        env:
          MAX_DETAILS_PER_RUN: ${{ inputs.quick_refresh && '0' || '5000' }}
          MAX_VARIANT_DETAILS: ${{ inputs.quick_refresh && '0' || '1500' }}
          MAX_RESOLVE_PER_RUN: ${{ inputs.quick_refresh && '0' || '5000' }}
          MAX_HISTORY_PER_RUN: ${{ inputs.quick_refresh && '100' || '2000' }}
          SYNC_BUDGET_MS: ${{ inputs.quick_refresh && '300000' || '1500000' }}
      # The save helper checkpoints raw progress, rebases it onto latest main,
      # then evaluates/builds/verifies once. Repeating analysis before this step
      # wastes the job budget and can time out as the history archive grows.
      - name: Save progress for the next day
        id: progress
        if: always() && steps.checkout.outcome == 'success'
        run: |
          git config user.name 'pokeradar-bot'
          git config user.email 'pokeradar-bot@users.noreply.github.com'
          bash scripts/save-progress.sh
      - name: Preserve a conflicting raw checkpoint
        if: failure() && steps.progress.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: pokeradar-raw-progress-${{ github.run_id }}
          path: ${{ runner.temp }}/pokeradar-checkpoint.tgz
          if-no-files-found: warn
          retention-days: 7
      - name: Retain evaluation history checkpoints
        if: always() && hashFiles('.cache/pokeradar/full-history.json') != ''
        uses: actions/cache/save@v4
        with:
          path: .cache/pokeradar/full-history.json
          key: ${{ steps.historycache.outputs.cache-primary-key }}
