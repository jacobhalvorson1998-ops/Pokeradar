name: Publish PokéRadar
on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - '.github/workflows/publish.yml'
  workflow_dispatch:
  workflow_run:
    workflows: ['Refresh Pokémon prices']
    types: [completed]
    branches: [main]
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pokeradar-pages
  cancel-in-progress: false
jobs:
  publish:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout latest site
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Restore historical evaluation archive
        uses: actions/cache/restore@v4
        with:
          path: .cache/pokeradar/full-history.json
          key: pokeradar-history-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            pokeradar-history-${{ runner.os }}-
      - name: Verify published data and model
        run: |
          node --test tests/*.test.mjs
          node scripts/backtest.mjs
          node scripts/build.mjs
          node scripts/verify-site.mjs
          node --check site/app.js
      - name: Python browser checks
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install browser test tools
        run: |
          python -m pip install -r requirements-dev.txt
          python -m playwright install --with-deps chromium webkit
      - name: Test iPhone-sized loading and interactions
        run: python tests/mobile_smoke.py
      - name: Test the mobile WebKit engine
        run: BROWSER_ENGINE=webkit python tests/mobile_smoke.py
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify the live mobile website
        run: python tests/public_smoke.py '${{ steps.deployment.outputs.page_url }}'

      - name: Verify the live mobile WebKit website
        run: BROWSER_ENGINE=webkit python tests/public_smoke.py '${{ steps.deployment.outputs.page_url }}'
